<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>墨记 · 关于代码、设计与生活的记录</title>
    <meta
      name="description"
      content="墨记是一个安静的写作角落，记录关于代码、设计与生活的思考。"
    />
    <meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101113" media="(prefers-color-scheme: dark)" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231b1d21'/%3E%3Cpath d='M9 22V10l7 8 7-8v12' fill='none' stroke='%23fbfaf7' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <script>
      // 先于渲染设置主题，避免深浅色切换时的闪白
      (function () {
        try {
          var saved = localStorage.getItem("moji-theme");
          document.documentElement.dataset.theme =
            saved ||
            (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <link rel="stylesheet" href="assets/style.css" />
  </head>

  <body>
    <header class="site-header">
      <div class="wrap site-header__inner">
        <a class="brand" href="index.html" aria-label="墨记 · 返回首页">
          <span class="brand__mark" aria-hidden="true">墨</span>
          <span class="brand__name">墨记</span>
        </a>

        <nav class="nav" aria-label="主导航">
          <a class="nav__link" href="index.html" aria-current="page">文章</a>
          <a class="nav__link" href="about.html">关于</a>
          <a class="nav__link" href="https://github.com" target="_blank" rel="noopener">GitHub</a>
          <button class="theme-toggle" type="button" id="themeToggle" aria-label="切换深色模式">
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
            </svg>
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
          </button>
        </nav>
      </div>
    </header>

    <main class="wrap">
      <section class="hero">
        <p class="hero__eyebrow">随笔 · 技术 · 思考</p>
        <h1>把想法写下来，<br />让它们慢慢长成文字。</h1>
        <p class="hero__lead">
          这里是墨记，一个安静的角落。不谈流量，不追热点，只存放那些值得多想一想的事情。
        </p>
      </section>

      <section class="toolbar" aria-label="筛选与搜索">
        <div class="chips" id="tagFilters" role="group" aria-label="按标签筛选"></div>
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="m20 20-3.5-3.5" />
          </svg>
          <input
            id="searchInput"
            type="search"
            placeholder="搜索标题、摘要或标签…"
            aria-label="搜索文章"
            autocomplete="off"
          />
        </div>
      </section>

      <p class="list-meta" id="resultCount" aria-live="polite"></p>

      <section class="post-grid" id="postList" aria-label="文章列表"></section>

      <p class="empty-state" id="emptyState" hidden>
        没有找到匹配的文章，换个关键词或标签试试。
      </p>

      <noscript>
        <div class="empty-state">
          <p>启用 JavaScript 后可以按标签筛选和搜索。下面是全部文章：</p>
          <p>
            <a href="posts/why-i-write.html">为什么我又开始写博客了</a><br />
            <a href="posts/build-a-quiet-blog.html">用原生 HTML 和 CSS 搭一个安静的博客</a><br />
            <a href="posts/on-focus.html">关于专注：把注意力还给当下</a>
          </p>
        </div>
      </noscript>
    </main>

    <footer class="site-footer">
      <div class="wrap site-footer__inner">
        <p style="margin: 0">© <span data-year>2026</span> 墨记 · 用原生 HTML 与 CSS 手写</p>
        <div class="site-footer__links">
          <a href="about.html">关于</a>
          <a href="https://github.com" target="_blank" rel="noopener">GitHub</a>
          <a href="mailto:hello@example.com">邮件</a>
        </div>
      </div>
    </footer>

    <script src="assets/blog.js"></script>
    <script src="assets/app.js"></script>
  </body>
</html>
